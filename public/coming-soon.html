<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>建设中 · Helonx's Zone</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #fff;
        background:
          linear-gradient(rgb(0 0 0 / 55%), rgb(0 0 0 / 65%)),
          url("./images/background1.jpg") center / cover no-repeat;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 520px);
        padding: 48px 32px;
        text-align: center;
        border: 1px solid rgb(255 255 255 / 20%);
        border-radius: 18px;
        background: rgb(0 0 0 / 35%);
        backdrop-filter: blur(16px);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 7vw, 3.2rem);
      }

      p {
        margin: 0;
        line-height: 1.8;
        color: rgb(255 255 255 / 80%);
      }

      a {
        display: inline-block;
        margin-top: 28px;
        padding: 10px 18px;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
        background: rgb(255 255 255 / 16%);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>正在建设中</h1>
      <p>这个页面还在准备，完成后会在这里与您见面。</p>
      <a href="./">返回首页</a>
    </main>
  </body>
</html>
